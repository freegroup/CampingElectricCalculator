plot: >-
  *   **Fall:** Bauteil (Kabeltyp FLRY-A vs. FLRY-B).

  *   **Konkrete Frage:** Warum nutzt man FLRY-Leitungen im Camper und welche
  Variante passt für welches Projekt?

  *   **Reihenfolge der Beantwortung:**
      *   *Einstieg:* Warum flexible Fahrzeugleitungen statt starrer Hauskabel in den Van gehören (Vibrationen) und warum FLRY durch die dünnere Isolierung im engen Kabelkanal Platz spart.
      *   *Vergleich FLRY-A vs. FLRY-B:* FLRY-A (wenige, dickere Einzeldrähte, dünnste Isolierung, starrer) vs. FLRY-B (viele, dünne Einzeldrähte, flexibler zu verlegen).
      *   *Einsatzbereich:* FLRY-A für gerade Strecken und feste Signalleitungen; FLRY-B als flexibler Allrounder für engere Radien und die Hauptverbraucher.
      *   *Praxis-Beispiel:* Dimensionierung einer typischen 12-V-Kompressorkühlbox am Heck des Vans.
      *   *Abschluss:* Überleitung zum interaktiven Kabelrechner.
  *   **Berechnete Zahlen:**
      *   Für eine 12-V-Kompressorkühlbox (5 A Stromstärke, 400 cm einfache Kabellänge) ist ein Querschnitt von **4 mm²** erforderlich (berechnet: 2,98 mm² inklusive 12 % Sicherheitsmarge, aufgerundet auf die nächste Standardgröße).
  *   **Passende Links:**
      *   `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/`
