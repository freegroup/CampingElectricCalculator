plot: >-
  **Fall-Typ:**

  System-Entscheidung & Rechenfrage (Reihe vs. Parallel)


  **Konkrete Frage:**

  Schalte ich meine Solarpanels in Reihe oder parallel – was passt zu meinen
  Reisezielen und welche Kabel brauche ich?


  **Ablauf:**

  * **Einstieg:** Mein Setup auf dem Dach (`foto-1.webp`) und die Frage, wie man
  das Maximum aus den Panels herausholt.

  * **Reihe (Serie) für den Norden:** Spannungen addieren sich. Ideal für
  Skandinavien oder bewölkte Tage. Durch die höhere Gesamtspannung springt der
  Laderegler morgens viel früher an, selbst bei schwachem Licht.

  * **Parallel für den Süden:** Ströme addieren sich. Perfekt, wenn man im Süden
  Schattenplätze sucht. Wird ein Panel teilverschattet, liefert das andere
  weiter voll ab. Bei einer Reihenschaltung zieht das verschattete Panel die
  Leistung des anderen spürbar mit runter.

  * **Die Kabel-Konsequenz:** Parallel bedeutet mehr Ampere. Das braucht dickere
  Kabel, um Leistungsverluste zu vermeiden.

  * **Rechenbeispiel (4 m Kabelweg, 2x 100 W Panels):**
    * *Parallel* (11 A bei 12 V) benötigt **8 mm²** (genau: 6,55 mm²).
    * *In Reihe* (5,5 A bei 24 V) benötigt **2,5 mm²** (genau: 1,64 mm²).
  * **Weg zum Tool:** Link zum Kabelrechner für die eigene Dimensionierung.


  **Zahlen & Berechnungen (400 cm Kabelweg):**

  * Parallel (11 A, 12 V): **8 mm²** (berechnet: 6,55 mm²)

  * Reihe (5,5 A, 24 V): **2,5 mm²** (berechnet: 1,64 mm²)


  **Verlinkbare Ziele:**

  * `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/`
  (Vergleich der Kabelstärken)

  * `https://camper-elektrik-planer.de/` (Für die gesamte Systemplanung)
