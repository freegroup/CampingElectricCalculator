text: "Schreibe einen Blog darüber, dass man eventuell seine Solarpanels
  parallel oder seriell verschalten kann, wenn es der Laderegler packt. Wichtig
  ist darzulegen, was der Unterschied ist: also Serie besser, wenn man ein wenig
  schattig steht, höhere Spannung, aber weniger Ausbeute. Parallel höherer
  Strom, aber weniger Spannung, und somit sollte man hier gut in der Sonne
  stehen."
