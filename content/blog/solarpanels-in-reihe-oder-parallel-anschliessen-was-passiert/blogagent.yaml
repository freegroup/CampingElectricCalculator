markdown: |-
  Als ich damals meine zwei Solarmodule auf das Dach geklebt habe, stand ich vor der Frage: In Reihe oder parallel schalten? Am Ende entscheidet das nicht nur darüber, wie viel Strom bei Wolken fließt, sondern auch über die Dicke deiner Kabel.

  ![Zwei Solarmodule auf einem Camper-Dach im warmen Abendlicht](foto-1.webp)

  Wo zieht es dich hin? Deine Reiseziele entscheiden über die Schaltung:

  **Reihe für den Norden**
  Wenn du im Norden unterwegs bist, wo die Sonne flach steht und es oft bewölkt ist, ist die Reihenschaltung perfekt. Die Spannungen der Module addieren sich. Weil die Gesamtspannung dadurch viel höher ist, springt dein Laderegler morgens viel früher an – er lädt die Batterie selbst bei schwachem Licht. Bei einer Parallelschaltung reicht die Spannung bei dicken Wolken oft gar nicht aus, um den Ladevorgang überhaupt zu starten.

  **Parallel für den Süden**
  Im heißen Süden parkst du deinen Camper gern im Halbschatten unter Bäumen. Hier ist die Parallelschaltung im Vorteil: Wird ein Modul teilverschattet, liefert das andere in der Sonne trotzdem die volle Leistung. Bei einer Reihenschaltung würde das verschattete Modul die Leistung des sonnigen Moduls spürbar mit runterziehen.

  **Die Sache mit dem Kabel**
  Parallel geschaltet fließt allerdings mehr Strom (Ampere). Und das bedeutet dickere Kabel, um Verluste zu vermeiden.

  Bei 4 Metern Kabelweg und zwei 100-Watt-Modulen sieht der Unterschied so aus:
  * **In Reihe (5,5 A bei 24 V):** Wenig Strom benötigt dünnere Kabel. Es reichen **2,5 mm²** (rechnerisch reichen 1,64 mm²).
  * **Parallel (11 A bei 12 V):** Der doppelte Strom erfordert ein deutlich dickeres Kabel von **8 mm²** (rechnerisch 6,55 mm²).

  Welche Kabelstärke für dein Setup passt, ermittelst du ganz einfach mit dem [Kabelquerschnitt-Rechner](https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/). Für die Planung deiner gesamten Anlage mit Laderegler und Batterie hilft dir der [Camper-Elektrik-Planer](https://camper-elektrik-planer.de/).
description: Reihe oder parallel schalten? Finde heraus, was bei Schatten besser
  lädt und welche Kabelstärke du für deinen Camper brauchst.
