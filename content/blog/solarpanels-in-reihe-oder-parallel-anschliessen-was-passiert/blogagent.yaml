plot: >-
  * **Fall-Typ:** Rechenfrage (Solar-Verschaltung & Leitungsquerschnitt)

  * **Konkrete Frage:** Wie schließe ich zwei Solarmodule am besten an – in
  Reihe oder parallel – und was macht das mit meinen Kabeln?

  * **Ablauf:**
    1. *Einstieg:* Mein Setup auf dem Dach (`foto-1.webp`) und die ewige Frage: Reihe oder parallel?
    2. *In Reihe (Serie):* Spannungen addieren sich. Vorteil: Der Laderegler springt bei Bewölkung und Schwachlicht viel früher an, weil die Mindestspannung schnell erreicht wird.
    3. *Parallel:* Ströme addieren sich. Nachteil: Bei Wolken bricht die Spannung ein und der Laderegler schaltet komplett ab. Zudem fließt mehr Strom durch die Leitungen.
    4. *Die Kabel-Konsequenz:* Mehr Strom bei Parallelschaltung verlangt nach dickeren Kabeln, um Verluste zu vermeiden.
    5. *Rechenbeispiel (4 m Kabelweg, 2x 100 W Panels):*
       * Parallel (11 A bei 12 V): Benötigt **8 mm²** (berechnet: 6,55 mm²).
       * In Reihe (5,5 A bei 24 V): Benötigt **2,5 mm²** (berechnet: 1,64 mm²).
    6. *Weg zum Tool:* Link zum Kabelrechner für die eigene Planung.
  * **Berechnete Zahlen (400 cm Kabelweg):**
    * Parallel (11 A, 12 V): **8 mm²** (genau: 6,55 mm²)
    * In Reihe (5,5 A, 24 V): **2,5 mm²** (genau: 1,64 mm²)
  * **Verlinkbare Ziele:**
    * `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/` (Direkt im Text für den Querschnitt-Vergleich)
    * `https://camper-elektrik-planer.de/` (Als Abschluss für die Systemplanung)
