plot: >-
  * **Fall-Typ:** Rechenfrage (Solar-Verschaltung & Leitungsquerschnitt).

  * **Konkrete Frage:** Reihe oder parallel – wie schließe ich meine Solarpanels
  auf dem Camper an und was macht das mit meinen Kabeln?

  * **Ablauf:**
    1. *Der Aha-Moment:* Meine Erfahrung mit zwei Panels auf dem Dach – die Entscheidung zwischen Volt und Ampere.
    2. *In Reihe:* Die Spannung addiert sich. Der Laderegler springt bei Bewölkung/Halbschatten früher an (höhere Spannung), aber die Gesamtausbeute sinkt stark, wenn ein Panel komplett im Schatten liegt.
    3. *Parallel:* Der Strom addiert sich. Perfekt für pralle Sonne, da ein verschattetes Panel das andere nicht runterzieht, verlangt aber wegen des höheren Stroms deutlich dickere Kabel.
    4. *Die harte Zahl:* Rechenbeispiel für den Kabelquerschnitt bei 4 m Leitungsweg (12 V System, 2x 100W Panel).
    5. *Überleitung zum Tool:* Direktes Nachrechnen der eigenen Konfiguration und Einplanung im Gesamtsystem (Regler-Limits beachten).
  * **Berechnete Zahlen (400 cm Kabelweg, 12 V):**
    * *Parallel (11 A):* Benötigt **8 mm²** (berechnet: 6,55 mm²).
    * *In Reihe (5,5 A):* Benötigt **4 mm²** (berechnet: 3,27 mm²).
  * **Verlinkbare Ziele:**
    * `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/` (Für den Querschnitt-Vergleich)
    * `https://camper-elektrik-planer.de/` (Für die Einbindung in den Schaltplan)
