plot: >-
  * **Fall-Typ:** Rechenfrage (Solar-Verschaltung & Leitungsquerschnitt)

  * **Konkrete Frage:** Reihe oder parallel – wie schließe ich zwei Solarmodule
  auf dem Camper am besten an und was bedeutet das für meine Kabel?

  * **Ablauf:**
    1. *Einstieg:* Mein Setup auf dem Dach (`foto-1.webp`) und die Entscheidung zwischen Reihen- und Parallelschaltung.
    2. *In Reihe (Serie):* Die Spannungen addieren sich. Vorteil: Der Laderegler springt bei Bewölkung und Schwachlicht viel früher an, da die Startspannung leicht erreicht wird. Nachteil: Ein harter Schatten auf einem Panel bremst das gesamte System aus.
    3. *Parallel:* Die Ströme addieren sich. Vorteil: Ein verschattetes Panel zieht das andere in der Sonne nicht runter. Nachteil: Die niedrigere Spannung führt dazu, dass der Regler bei Bewölkung gar nicht erst startet. Zudem fließt mehr Strom.
    4. *Die Kabel-Konsequenz:* Höherer Strom bei Parallelschaltung verlangt nach deutlich dickeren Kabeln, um den Spannungsfall zu minimieren.
    5. *Rechenbeispiel (4 m Kabelweg, 2x 100 W Panels bei 12 V):*
       * Parallel (11 A): Benötigt **8 mm²** (berechnet: 6,55 mm²).
       * In Reihe (5,5 A): Benötigt **4 mm²** (berechnet: 3,27 mm²).
    6. *Weg zum Tool:* Direktes Nachrechnen der eigenen Konfiguration und Einplanung im Gesamtsystem.
  * **Berechnete Zahlen (400 cm Kabelweg, 12 V):**
    * Parallel (11 A): **8 mm²** (genau: 6,55 mm²)
    * In Reihe (5,5 A): **4 mm²** (genau: 3,27 mm²)
  * **Verlinkbare Ziele:**
    * `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/` (Für den Querschnitt-Vergleich)
    * `https://camper-elektrik-planer.de/` (Für die Einbindung in den Schaltplan)
