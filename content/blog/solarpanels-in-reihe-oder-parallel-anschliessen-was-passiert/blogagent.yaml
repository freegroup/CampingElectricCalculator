plot: >-
  **Fall-Typ:**

  Rechenfrage / System-Entscheidung (Reihe vs. Parallel & Leitungsquerschnitt)


  **Konkrete Frage:**

  Schalte ich meine Solarpanels in Reihe oder parallel – was passt zu meinen
  Reisezielen und welche Kabel brauche ich?


  **Ablauf:**

  1. **Einstieg:** Mein Setup auf dem Dach (`foto-1.webp`) und das ewige Grübeln
  über die richtige Verschaltung.

  2. **Reihe (Serie) für den Norden:** Spannungen addieren sich. Ideal bei
  Wolken und flacher Sonne (z. B. Skandinavien). Der Laderegler springt durch
  die höhere Spannung viel früher an.

  3. **Parallel für den Süden:** Ströme addieren sich. Ideal, wenn man wegen der
  Hitze im Schatten parkt (z. B. unter Bäumen). Wird ein Panel schattig, liefert
  das andere trotzdem voll ab. Bei Reihe würde der Stromfluss komplett
  blockiert.

  4. **Kabel-Konsequenz:** Bei Parallelschaltung fließt mehr Strom (Ampere), was
  dickere Kabel verlangt, um Verluste zu vermeiden.

  5. **Rechenbeispiel (4 m Kabelweg, 2x 100 W Panels):**
     * *Parallel* (11 A bei 12 V): Benötigt **8 mm²** (genau: 6,55 mm²).
     * *In Reihe* (5,5 A bei 24 V): Benötigt **2,5 mm²** (genau: 1,64 mm²).
  6. **Weg zum Tool:** Link zum Kabelrechner für die eigene Dimensionierung.


  **Zahlen & Berechnungen (400 cm Kabelweg):**

  * Parallel (11 A, 12 V): **8 mm²** (empfohlen) / 6,55 mm² (berechnet)

  * Reihe (5,5 A, 24 V): **2,5 mm²** (empfohlen) / 1,64 mm² (berechnet)


  **Verlinkbare Ziele:**

  * `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/` (Direkt
  beim Kabel-Vergleich)

  * `https://camper-elektrik-planer.de/` (Für die gesamte Systemplanung)
