text: >-
  Entdecke die tolle Möglichkeit, TPU und PLA in einem einzigen 3D-Druck zu
  verwenden! So lassen sich prima Drehknöpfe für Radios oder deine
  Arduino-Projekte herstellen, die sich auch einfach toll anfühlen. 


  (Hinweis für den Telegram-Kanal: Als Hintergrundbild dient ein Snapmaker U1
  Drucker.)
