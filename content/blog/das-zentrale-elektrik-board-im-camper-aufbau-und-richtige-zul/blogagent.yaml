plot: >-
  * **Fall**: Bauteil (Die vorgefertigte Montageplatte / das Elektrik-Board)

  * **Bild**: foto-1.webp

  * **Konkrete Frage**: Warum ist ein zentrales Elektrik-Board die halbe Miete
  und wie berechnest du die Zuleitung dafür fehlerfrei?

  * **Reihenfolge der Beantwortung**:
      1. **Der Hook**: Warum Vorarbeiten auf der Werkbank (wie in `foto-1.webp`) 10-mal geiler ist als das Verdrahten in der engen, dunklen Sitzkiste.
      2. **Was man sieht**: Strukturierter Aufbau mit MPPT-Regler, Sicherungsverteiler, Busbars und Hauptschalter auf einer Siebdruckplatte.
      3. **Das Risiko**: Schätzen statt rechnen bei den kurzen, dicken Kabeln führt zu gefährlichem Spannungsabfall oder Kabelbrand.
      4. **Konkretes Rechenbeispiel**: Die Hauptzuleitung vom Board zur Batterie. Bei 60 A Stromstärke und 100 cm Kabellänge (einfacher Weg) bei 12 V Systemspannung.
      5. **Die Lösung**: Verweis auf den Kabelrechner für alle anderen Verbraucher auf dem Board.
  * **Berechnung (mit Tool)**:
      * *Eingabe*: 60 A, 100 cm Länge, 12 V.
      * *Ergebnis*: **16 mm²** erforderlicher Kabelquerschnitt (berücksichtigt 2 % Spannungsverlust und 12 % Sicherheitsmarge).
  * **Verlinkbare Ziele**:
      * `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/` (Für die Querschnitte der restlichen Board-Verkabelung)
      * `https://camper-elektrik-planer.de/` (Für die Planung des gesamten Setups vor dem Schrauben)
