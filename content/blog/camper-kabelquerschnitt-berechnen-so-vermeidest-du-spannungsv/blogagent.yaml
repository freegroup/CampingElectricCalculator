plot: >-
  - **Fall:** Rechenfrage


  - **Konkrete Frage:** Wie berechne ich den passenden Kabelquerschnitt für
  meine Camper-Elektrik selbst, um Spannungsverluste zu vermeiden?


  - **Ablauf des Artikels:**
    1. *Einstieg:* Mein eigener Trugschluss beim ersten Ausbau, dass dünne Kabel für 12 V schon reichen werden.
    2. *Die Erklärung:* Warum bei 12 V der Spannungsabfall der größte Feind ist und warum man immer den Hin- und Rückweg (Zweiadrig) betrachten muss.
    3. *Das Rechenbeispiel:* Eine typische Kompressor-Kühlbox (5 A, 4 m einfache Kabellänge).
    4. *Das Ergebnis:* Rechnerischer Wert (2,98 mm²) und warum wir in der Praxis auf den nächsten Standardwert (4 mm²) aufrunden.
    5. *Der Übergang:* Verweis auf das Tool, um jedes eigene Gerät (Standheizung, USB-Dose, Ladebooster) in Sekunden selbst zu berechnen.

  - **Gerechnete Zahlen:**
    - Systemspannung: 12 V
    - Stromstärke Kühlbox: 5 A
    - Einfache Länge: 400 cm
    - Berechneter Querschnitt (inkl. 12 % Sicherheitsmarge & 2 % Spannungsfall): 2,98 mm²
    - Empfohlener Standardquerschnitt: 4 mm²

  - **Zweites Bild (foto-2.webp):** Ein warmes, ästhetisches Foto aus dem
  Camper-Innenraum. Auf einer Holz-Arbeitsplatte liegt ein Stück dickerer
  Kabelstrang, eine Crimpzange und ein paar goldene Kabelschuhe im weichen
  Nachmittagslicht.


  - **Passende Links:**
    - `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/`
