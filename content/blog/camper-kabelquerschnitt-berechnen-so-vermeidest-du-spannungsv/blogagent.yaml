text: Welchen Querschnitt benötige ich denn für den Camper-Ausbau und meine
  Elektrik? Mach noch ein zweites gutes Bild dazu.
briefing: camper-blog
context:
  target_url: https://camper-elektrik-planer.de/blog/solarpanels-in-reihe-oder-parallel-anschliessen-was-passiert/
  reference_urls: []
