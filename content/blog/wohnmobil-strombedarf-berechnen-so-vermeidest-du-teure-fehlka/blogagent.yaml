text: Ermittel doch deinen wahren Bedarf an Strom, den du im Camper brauchst. Du
  hast keine Ahnung, wie du das machen sollst? Da hilft dir natürlich der
  Konfigurator. Du brauchst nicht immer 400 Watt Solarzelle plus Landstrom plus
  Lichtmaschine. Geht auch anders, kannst du machen. Trag einfach deine Geräte
  ein, die du hast und ermittle dann, wie lange du freistehen kannst, mit
  welcher Batterie du deine Reichweite noch erhöhen kannst und welche
  Lademöglichkeiten du sonst brauchst.
plot: >-
  **Fall**

  Rechenfrage (Wie viel Strom brauche ich wirklich und wie vermeide ich teure
  Überdimensionierung?).


  **Konkrete Frage**

  Wie ermittle ich meinen echten Strombedarf im Camper und plane die Anlage
  passend, ohne blind teure 400W-Solarsets zu kaufen?


  **Reihenfolge der Beantwortung**

  * **Der Trugschluss:** Warum "Sicherheitshalber die größte Batterie und
  maximal Solar" dich Geld, Gewicht und Platz kostet.

  * **Die Bestandsaufnahme:** Wie du den echten Verbrauch deiner Geräte (z. B.
  Kompressorkühlschrank) in Amperestunden (Ah) erfasst.

  * **Die Detail-Sicherheit:** Warum auch der kleinste Verbraucher das richtige
  Kabel braucht (Rechnung Kabelquerschnitt für den Kühlschrank).

  * **Die Dimensionierung:** Wie du aus dem Tagesbedarf die richtige
  Batteriegröße und die passenden Ladequellen (Ladebooster vs. Solar) ableitest.

  * **Der smarte Weg:** Warum du nicht schätzen musst, wenn ein Tool die gesamte
  Energiebilanz für dich rechnet.


  **Gerechnete Zahlen (mit `wire_cross_section`)**

  * Verbraucher: Kompressorkühlschrank (50 W an 12 V = 4,17 A)

  * Einfache Kabellänge: 300 cm

  * Benötigter Kabelquerschnitt: **2,5 mm²** (exakt berechnet bei 2 %
  Spannungsfall und 12 % Sicherheitsmarge)


  **Verlinkbare Ziele**

  * `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/` (für die
  Kabelberechnung des Kühlschranks)

  * `https://camper-elektrik-planer.de/` (als finaler Call-to-Action für die
  komplette Energiebilanz und den Schaltplan)


  **Titelbild**

  Hochwertiges, helles Foto aus dem Innenraum eines modernen Vans. Auf einem
  warmen Holztisch steht ein Laptop mit einer Planungs-App, daneben eine
  Kaffeetasse. Im Hintergrund ist die stylische Küchenzeile mit dem Kühlschrank
  im weichen, goldenen Abendlicht zu sehen. Keine Grafiken, keine Overlays –
  pure, einladende Vanlife-Ästhetik.
