text: >-
  Bitte den Text auf Insta posten:


  Als ich damals meine zwei Solarmodule auf das Dach geklebt habe, stand ich vor
  der Frage: In Reihe oder parallel schalten? Am Ende entscheidet das nicht nur
  darüber, wie viel Strom bei Wolken fließt, sondern auch über die Dicke deiner
  Kabel.


  ![Zwei Solarmodule auf einem Camper-Dach im warmen Abendlicht](foto-1.webp)


  Wo zieht es dich hin? Deine Reiseziele entscheiden über die Schaltung:


  **Reihe für den Norden**

  Wenn du im Norden unterwegs bist, wo die Sonne flach steht und es oft bewölkt
  ist, ist die Reihenschaltung perfekt. Die Spannungen der Module addieren sich.
  Weil die Gesamtspannung dadurch viel höher ist, springt dein Laderegler
  morgens viel früher an – er lädt die Batterie selbst bei schwachem Licht. Bei
  einer Parallelschaltung reicht die Spannung bei dicken Wolken oft gar nicht
  aus, um den Ladevorgang überhaupt zu starten.


  **Parallel für den Süden**

  Im heißen Süden parkst du deinen Camper gern im Halbschatten unter Bäumen.
  Hier ist die Parallelschaltung im Vorteil.
