plot: >-
  * **Fall:** Bauteil (Systementscheidung Solaranlage)

  * **Konkrete Frage:** Wie stark beeinflusst die Entscheidung zwischen Reihen-
  und Parallelschaltung bei zwei 100-Wp-Modulen den benötigten Kabelquerschnitt?

  * **Reihenfolge der Beantwortung:**
      * **Einstieg:** Mein eigener Solaranbau – die Entscheidung zwischen Reihe und parallel bestimmt nicht nur den Ertrag, sondern direkt die Kabeldicke.
      * **Norden (Reihe):** Höhere Spannung (40 V), Laderegler startet bei Bewölkung früher, geringerer Strom ermöglicht dünnere Kabel.
      * **Süden (Parallel):** Höherer Strom (10 A), schattentoleranter unter Bäumen, benötigt aber deutlich dickere Kabel zur Verlustvermeidung.
      * **Zahlen-Beispiel:** Konkreter Querschnittsvergleich für beide Szenarien bei 5 m Kabellänge.
      * **Weg zum Rechner:** Verweis auf den Kabelrechner für die eigene Planung.
  * **Berechnete Zahlen (2x 100 Wp Module mit je 20 V / 5 A, bei 5 m
  Kabellänge):**
      * Reihenschaltung (40 V / 5 A): **2,5 mm²** (berechnet: 1,12 mm²)
      * Parallelschaltung (20 V / 10 A): **6 mm²** (berechnet: 4,46 mm²)
  * **Verlinkbare Ziele:**
      * `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/`
