  **Fall**

  Rechenfrage / Planungsansatz (symbolisiert durch das Nachdenken auf dem Foto)


  **Konkrete Frage**

  Wie berechne ich vor dem Kauf die Kabelquerschnitte meiner Camper-Elektrik
  richtig, um Fehler zu vermeiden?


  **Reihenfolge der Beantwortung**

  * **Einstieg:** Bezug zu `foto-1.webp` – Warum stilles Nachdenken und Planen
  vor dem ersten Kabelkauf Frust und Fehlkäufe spart (Ich-Perspektive: "Ich saß
  damals auch so da und habe gegrübelt").

  * **Das Problem:** Kabel werden oft nach Gefühl oder Tabellen aus dem Internet
  gekauft, ohne den realen Spannungsabfall zu berücksichtigen.

  * **Der konkrete Rechenweg:** Beispiel Ladebooster (30 A Ladestrom, 12 V
  System, 3 m einfache Kabellänge).

  * **Das exakte Ergebnis:** Aufzeigen, wie aus 30 A auf 3 m ein notwendiger
  Querschnitt von 16 mm² wird.

  * **Der Weg zum Rechner:** Vorstellung des Tools, das die genaue Berechnung
  für jeden Verbraucher übernimmt.


  **Gerechnete Zahlen**

  * Verbraucher: Ladebooster (30 A, 12 V, 300 cm einfache Länge)

  * Berechneter Querschnitt: 13,39 mm²

  * Empfohlener, handelsüblicher Querschnitt (aufgerundet): 16 mm²


  **Verlinkbare Ziele**

  * `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/`
  (Direktlink für das Rechenbeispiel)

  * `https://camper-elektrik-planer.de/` (Für die gesamte Schaltplan-Planung)
