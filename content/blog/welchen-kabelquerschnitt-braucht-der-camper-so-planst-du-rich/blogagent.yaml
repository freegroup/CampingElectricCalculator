plot: >-
  * **Fall:** Rechenfrage / Planungs-Einstieg (Wie plane ich die Elektrik, bevor
  der Kabelsalat entsteht?).

  * **Konkrete Frage:** Wie vermeide ich Planungsfehler beim Kabelquerschnitt
  und behalte von Anfang an den Überblick?

  * **Reihenfolge der Beantwortung:**
      * *Einstieg:* Das Bild (`foto-1.webp`) zeigt es gut – die meiste Zeit beim Ausbau verbringt man mit Nachdenken, bevor das erste Kabel liegt. Das spart später Zeit und Nerven.
      * *Das Problem:* Draufloskaufen führt entweder zu gefährlich dünnen Kabeln oder zu unnötig teurem Kupfer-Overkill im Van.
      * *Mein Weg:* Jedes Kabel einzeln nach Systemspannung, Stromstärke und exakter Länge bestimmen, statt zu schätzen.
      * *Konkretes Rechenbeispiel:* Ein 12-V-Kompressorkühlschrank mit 4 A Dauerstrom, der 4 Meter (einfache Strecke) von der Batterie entfernt steht.
      * *Die Lösung:* Erklärung, warum hier 2,5 mm² wegen des Spannungsfalls zu knapp sind und warum 4 mm² die sichere Wahl sind.
      * *Der Übergang:* Verweis auf die Tools, die das fehlerfrei abnehmen.
  * **Berechnete Zahlen (mit `wire_cross_section`):**
      * Systemspannung: 12 V
      * Stromstärke: 4 A
      * Einfache Kabellänge: 400 cm
      * Rechnerischer Querschnitt: 2,38 mm²
      * Empfohlener Querschnitt (nächsthöherer Standard): **4 mm²** (bei max. 2 % Spannungsfall)
  * **Verlinkbare Ziele:**
      * `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/`
      * `https://camper-elektrik-planer.de/`
