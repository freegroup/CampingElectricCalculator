plot: >-
  * **Fall:** Rechenfrage / Planungs-Einstieg (Elektrik-Planung ohne
  Kabelsalat).

  * **Konkrete Frage:** Wie vermeide ich Planungsfehler beim Kabelquerschnitt
  und behalte von Anfang an den Überblick?

  * **Reihenfolge der Beantwortung:**
      * *Einstieg:* Planung direkt am Ort des Geschehens. Das neue Beispielfoto zeigt die gemütliche Planungsphase im halbfertigen Van mit Laptop auf einer Holzplatte – das schafft Fokus und echte Vorfreude.
      * *Das Problem:* Einfach draufloskaufen führt im Camper entweder zu gefährlich dünnen Kabeln oder zu unnötig teurem, schwer verlegbarem Kupfer-Overkill.
      * *Mein Weg:* Keine Schätzungen. Jedes Kabel wird von Anfang an exakt nach Systemspannung, Stromstärke und der tatsächlichen Leitungslänge bestimmt.
      * *Konkretes Rechenbeispiel:* Ein 12-V-Kompressorkühlschrank mit 4 A Stromaufnahme, der 4 Meter (einfache Strecke) von der Versorgerbatterie entfernt verbaut wird.
      * *Die Lösung:* Warum 2,5 mm² rechnerisch zu knapp bemessen sind (Spannungsfall) und weshalb 4 mm² hier die einzig richtige, sichere Wahl für einen reibungslosen Betrieb sind.
      * *Der Übergang:* Direktes Verlinken der Tools, die diese Rechnungen fehlerfrei übernehmen.
  * **Berechnete Zahlen (mit `wire_cross_section` ermittelt):**
      * Systemspannung: 12 V
      * Stromstärke: 4 A
      * Einfache Kabellänge: 400 cm
      * Rechnerischer Querschnitt: 2,38 mm²
      * Empfohlener Standardquerschnitt: **4 mm²** (unter Berücksichtigung von 2 % Spannungsfall und 12 % Sicherheitsmarge)
  * **Verlinkbare Ziele:**
      * `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/` (Fokus-Link)
      * `https://camper-elektrik-planer.de/`
