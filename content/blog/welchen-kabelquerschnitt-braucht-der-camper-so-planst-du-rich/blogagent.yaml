markdown: |-
  Ich kenne das: Man sitzt stundenlang im leeren Van oder starrt auf den Bodenplan und geht im Kopf jede einzelne Steckdose durch. Die meiste Zeit beim Ausbau geht ohnehin für das Nachdenken drauf, bevor überhaupt das erste Kabel liegt. Aber genau diese Ruhe spart am Ende die Nerven, die man beim Suchen von Fehlern in einem wirren Kabelsalat verliert.

  ![Nachdenken vor dem Einbau spart später Zeit und Nerven](foto-1.webp)

  Wer einfach draufloskauft, steht schnell vor zwei Problemen: Entweder greift man zu dünnen Leitungen, bei denen am Ende die Geräte streiken, oder man kauft völlig überdimensionierten Kupfer-Overkill, der das Budget unnötig belastet und sich kaum noch vernünftig verlegen lässt. Ich habe für mich gelernt, dass Schätzen bei der Elektrik nicht funktioniert. Jedes Kabel braucht seinen exakten Querschnitt, basierend auf der Systemspannung, der Stromstärke des Verbrauchers und der genauen Leitungslänge.

  Nehmen wir ein klassisches Beispiel aus meiner eigenen Planung: Ein kleiner 12-V-Kompressorkühlschrank zieht im Betrieb etwa 4 Ampere Dauerstrom. Er steht auf der gegenüberliegenden Seite des Vans, die einfache Kabellänge von der Batterie bis zum Kühlschrank beträgt genau 4 Meter (also 400 Zentimeter).

  Rechnet man das für ein 12-Volt-System durch, ergibt sich rechnerisch ein Mindestquerschnitt von 2,38 mm². Auf den ersten Blick könnte man meinen, dass ein handelsübliches 2,5 mm² Kabel ausreicht. Weil aber der Spannungsfall im Camper maximal 2 % betragen sollte und eine Sicherheitsmarge von 12 % eingerechnet wird, ist 2,5 mm² hier schlichtweg zu knapp. Der Spannungsverlust wäre zu hoch, und der Kühlschrank könnte vor allem beim Anlaufen wegen Unterspannung abschalten. Die sichere und verlässliche Wahl ist hier der nächsthöhere Standardquerschnitt: 4 mm².

  Damit läuft der Kühlschrank stabil, ohne dass Energie auf dem Weg verloren geht. Um solche Rechnungen nicht jedes Mal im Kopf machen zu müssen, nutze ich digitale Helfer. 

  Mit dem [Kabelquerschnitt-Rechner](https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/) lässt sich der passende Querschnitt für jeden Verbraucher im Van in wenigen Sekunden ermitteln. Wer direkt die gesamte Elektrik inklusive Absicherung und Komponenten im Blick behalten möchte, plant das ganze System am besten direkt im [Camper-Elektrik-Planer](https://camper-elektrik-planer.de/). Das gibt am Ende das gute Gefühl, dass alles passt – noch bevor der erste Seitenschneider in die Hand genommen wird.
