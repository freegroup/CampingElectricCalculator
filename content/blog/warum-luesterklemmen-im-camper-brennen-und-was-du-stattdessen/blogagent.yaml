text: Ich schreibe einen Artikel über den Vor- und Nachteil von Vago-Klemmen im
  Vergleich zu Lüsterklemmen beim Van-Ausbau. Also Lüsterklemmen geht eigentlich
  gar nicht. Jemand, der mit Elektrik zu tun hat, weiß das. Vago-Klemmen ist das
  A und O, es rüttelt fest, stabil, bricht nicht, rostet nicht vor sich hin.
  Aber das weiß nicht jeder, der einen Van ausbaut. Das heißt, der Artikel
  sollte für Leute sein, die zum ersten Mal ihren Camper-Van oder Van-Life
  betreiben seien, wo das kurz und knapp erklärt wird, mit einem schönen Bild,
  wo man eine Vago-Klemme und eine Lüsterklemmen sieht und mit einem
  Fragezeichen, welches nehme ich denn.
plot: >-
  * **Fall:** Bauteil (Die Wago-Klemme 221 im Vergleich zur Lüsterklemme).

  * **Konkrete Frage:** Warum führen Lüsterklemmen im Camper zum Kabelbrand und
  warum ist die Wago-Verbindungsklemme (Serie 221) die einzig sichere Wahl?

  * **Reihenfolge der Beantwortung:**
    1. *Der Aufhänger:* Das Problem mit starren Schraubverbindungen (Lüsterklemmen) bei ständiger Vibration im Camper (Drahtbruch, Lockerung).
    2. *Die Lösung:* Wago-Hebelklemmen (Serie 221) mit Federzugtechnik – sie halten dauerhaft vibrationsfest und verkraften flexible Litzen ohne Aderendhülsen.
    3. *Praxis-Tipp:* Worauf beim Kauf achten (originale Wago 221 bis 4 $mm^2$, keine billigen Klone).
    4. *Das Rechenbeispiel:* Welchen Querschnitt du für einen typischen Verbraucher brauchst und ob er in die Klemme passt.
    5. *Call to Action:* Link zum Kabelrechner für die eigene Dimensionierung.
  * **Rechnung (Beispiel 12V-Lichtkreis im Heck):**
    * Systemspannung: 12 V
    * Stromstärke: 5 A (z. B. LED-Spots und USB-Lader)
    * Kabellänge (einfach): 4 m (400 cm)
    * Errechneter Mindestquerschnitt: **4 $mm^2$** (Wichtig: Passt exakt in die Standard-Wago 221-41x).
  * **Verlinkbare Ziele:**
    * `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/` (Zur Berechnung des passenden Querschnitts für die Wago-Klemmen).
    * `https://camper-elektrik-planer.de/` (Für die Gesamtplanung des Stromlaufs).
  * **Titelbild-Konzept:** Hochwertiges, helles Foto auf einer hölzernen
  Camper-Werkbank im weichen Tageslicht. Im Fokus liegt eine orange-transparente
  Wago 221 Klemme neben einer alten, leicht oxidierten Plastik-Lüsterklemme auf
  einem Schaltplan-Entwurf. Im Hintergrund unscharf die offene Schiebetür eines
  Vans im Grünen.
