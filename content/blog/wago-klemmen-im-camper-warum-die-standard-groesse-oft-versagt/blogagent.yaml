plot: >-
  * **Fall:** Bauteil (Die Wago-Klemme Serie 221).

  * **Konkrete Frage:** Warum sind Wago-Klemmen der sicherste Gamechanger für
  deine Camper-Verkabelung und worauf musst du beim Querschnitt achten?


  * **Bild-Konzept:**
    * **Bild 1:** Makro-Aufnahme einer Wago-Klemme 221, gehalten zwischen zwei Fingern. Im weichgezeichneten, warmen Hintergrund (Bokeh) ist der gemütliche, stilvolle Holzausbau eines Vans mit brennender Lichterkette erkennbar. Insta-Aesthetic, natürliches Licht.

  * **Reihenfolge der Argumentation:**
    * **Der Pain:** Starre Lüsterklemmen vibrieren sich im Camper lose – Brandgefahr durch Lichtbögen. Crimpverbindungen erfordern teures Spezialwerkzeug.
    * **Die Lösung:** Die Wago-Klemme (Serie 221) hält Kabel per Federkraft dauerhaft vibrationssicher und verbindet flexible Camper-Adern werkzeuglos.
    * **Das Fail-Potential:** Wagos dürfen nicht lose hinter der Wand fliegen (Zugentlastung und Gehäuse/Verteilerdose fehlen oft).
    * **Der Querschnitts-Check:** Standard-Wagos (221-4xx) gehen nur bis 4 mm². Wer dickere Kabel für größere Lasten oder lange Wege braucht, muss die 6 mm² Variante (221-6xx) nutzen.
    * **Beispiel & Brücke zum Tool:** Berechnung zeigt, wann die Standard-Klemme versagt.

  * **Rechnung (mit `wire_cross_section`):**
    * **Szenario:** 12 V System, Heck-Verbraucher (z.B. Kühlbox) mit 5 A Dauerstrom, 500 cm Kabellänge (einfacher Weg).
    * **Ergebnis:** Empfohlener Kabelquerschnitt = **6 mm²** (rechnerisch 3,72 mm² plus Sicherheitsmarge).
    * **Konsequenz:** Die Standard-Wago (bis 4 mm²) reicht hier nicht mehr aus; es muss die 6 mm²-Variante verwendet werden.

  * **Passendes Ziel:**
    * `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/`
