text: Mache auf Pinterest einen Post über Wago-Klemmen und dass diese Teile ein
  Must-have beim Camper-Van-Ausbau sein sollten. Top-Tipp 😊 Zeige eine
  Wago-Klemme im Bild und im Hintergrund einen Insta-Camper-Van im Lifestyle.
