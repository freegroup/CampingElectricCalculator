plot: >-
  **Fall**

  Rechenfrage / Einstieg in die Planung (mit metaphorischem User-Foto)


  **Konkrete Frage**

  Wie plane ich meine Camper-Elektrik logisch von Anfang an, statt planlos Kabel
  zu kaufen und zu dicke oder zu dünne Querschnitte zu wählen?


  **Reihenfolge**

  1. **Der Moment vor dem Start:** Warum herumsitzen und grübeln (wie auf dem
  Foto) besser ist, als direkt den Seitenschneider in die Hand zu nehmen.

  2. **Die größte Stolperfalle:** Schätzen statt Rechnen – warum Bauchgefühl bei
  12V-Strömen zu massiven Spannungsverlusten führt.

  3. **Das konkrete Beispiel:** Die Zuleitung für den Ladebooster (30 A) über 5
  Meter Länge von der Starterbatterie nach hinten. 

  4. **Der Aha-Effekt:** Die nackten Zahlen zeigen, warum 16 mm² zu dünn sind
  und es 35 mm² sein müssen.

  5. **Der Weg zur Lösung:** Verweis auf die Rechner-Tools für den stressfreien
  Ausbau.


  **Berechnete Zahlen (mit `wire_cross_section`)**

  - Stromstärke: 30 A

  - Kabellänge (einfach): 5 m (500 cm)

  - Spannung: 12 V

  - Erforderlicher Querschnitt (mit 2 % Spannungsfall & 12 % Marge): **35 mm²**
  (exakt berechnet: 22,32 mm², aufgerundet auf die nächste Standardgröße).


  **Verlinkbare Ziele**

  - `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/` (Für die
  schnelle Querschnitt-Prüfung)

  - `https://camper-elektrik-planer.de/` (Für den gesamten Schaltplan und die
  Stückliste)
