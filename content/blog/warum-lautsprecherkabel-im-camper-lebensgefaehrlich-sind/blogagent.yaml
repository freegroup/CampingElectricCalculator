plot: >-
  - **Pitch-Typ**: Fehlerbild (Lautsprecherkabel zweckentfremdet als
  Stromkabel).

  - **Konkrete Frage**: Warum ist die Nutzung von Lautsprecherkabeln für die
  12-V-Stromversorgung im Camper lebensgefährlich?


  - **Reihenfolge der Argumentation**:
    1. Der Impuls: "Da liegt noch billiges Lautsprecherkabel im Keller – das reicht doch für die USB-Buchse."
    2. Die reale Gefahr: Es geht nicht um die Leitfähigkeit, sondern um den Mantel. Lautsprecherkabel haben meist eine einfache PVC-Isolierung, die im Brandfall wie ein Docht wirkt.
    3. Der Unterschied zu Kfz-Leitungen: Echte Fahrzeugleitungen (z. B. FLRY, FLY) sind flammhemmend und selbstverlöschend nach ISO 6722. Sie schmelzen bei Überlastung, tragen aber kein offenes Feuer weiter.
    4. Die Konsequenz: Ein Kurzschluss am Lautsprecherkabel entzündet die Isolierung und setzt in Sekunden die Isolierung/Holzverkleidung des Vans in Brand.
    5. Der richtige Weg: Nur zertifizierte Kfz-Kabel verwenden und den Querschnitt exakt berechnen.

  - **Rechnung**:
    - Verbraucher mit 10 A (z. B. Kühlbox/Standheizung beim Start), 3 m einfache Kabellänge (300 cm), bei 12 V Systemspannung.
    - Ergebnis mit Tool `wire_cross_section`: **6 mm²** (rechnerisch 4,46 mm², aufgerundet auf die nächste Standardgröße). Ein typisches Lautsprecherkabel (meist 0,75 bis 2,5 mm²) wäre hier massiv unterdimensioniert und brandgefährlich.

  - **Bild-Konzept (1 Bild)**:
    - Nahaufnahme einer sauberen 12-V-Verkabelung im Camper mit rot/schwarzen FLRY-Fahrzeugleitungen, die in einem Sicherungshalter enden. Warmes, natürliches Tageslicht fällt seitlich auf die aufgeräumte Installation. Keine Grafiken, absolut fotorealistisch.

  - **Verlinkbare Ziele**:
    - `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/` (Hauptlink für die Querschnittsberechnung).
    - `https://camper-elektrik-planer.de/` (Verweis für den gesamten Schaltplan).
