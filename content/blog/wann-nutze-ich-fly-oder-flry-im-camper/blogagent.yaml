plot: >-
  * **Fall:** Bauteil (Kfz-Leitungen FLY und FLRY).

  * **Konkrete Frage:** Wann benutze ich FLY, FLRY-A oder FLRY-B im Camper und
  wie finde ich den passenden Querschnitt?

  * **Reihenfolge der Beantwortung:**
    * *Einstieg:* Warum ich im Van ausschließlich flexible Kfz-Leitungen statt starrer Haushaltskabel verlege.
    * *Unterschied FLY vs. FLRY:* FLY ist der Standard mit dickerer Isolierung; FLRY spart durch reduzierte Wandstärke extrem viel Platz und Gewicht im Kabelkanal.
    * *FLRY-A vs. FLRY-B:* FLRY-A ist dank dünnerer Einzeldrähte super flexibel für enge Ecken; FLRY-B hat dickere Einzeldrähte und ist mechanisch robuster.
    * *Praxis-Anwendung:* Meine Aufteilung im Van – FLRY-A für LED-Spots und Sensorik, FLRY-B für USB-Dosen und mittlere Verbraucher.
    * *Berechnungs-Beispiel:* Warum der Querschnitt trotz dünnerer Isolierung exakt stimmen muss (z. B. für die Kühlbox).
    * *Abschluss:* Verweis auf das Rechner-Tool für die eigene Dimensionierung.
  * **Berechnete Zahlen für das Beispiel:**
    * Verbraucher: Kompressorkühlbox mit 5 A Dauerstrom
    * Kabellänge: 400 cm (einfache Strecke) bei 12 V
    * Ergebnis: Erforderlicher Kabelquerschnitt ist 4 mm² (berechnet mit dem Tool `wire_cross_section`).
  * **Verlinkbare Ziele:**
    * `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/` (Fokus-Link für diesen Beitrag)
    * `https://camper-elektrik-planer.de/` (Als ergänzender Link für die gesamte Systemplanung)
