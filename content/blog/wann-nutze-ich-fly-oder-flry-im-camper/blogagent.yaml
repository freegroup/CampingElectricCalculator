text: >-
  Bitte für den Instagram-Kanal schreiben:


  Nur spezielle Kfz-Stromkabel bei der Van Elektronik verwenden!

  Beim Ausbau eines Campers ist die Wahl der richtigen Fahrzeugleitungen
  entscheidend für die Sicherheit und Effizienz Deiner elektrischen Anlage. Bei
  der Van Elektronik kommen daher die Fahrzeugleitungen FLY und FLRY zum
  Einsatz. Doch welche der beiden solltest Du wann nutzen? Hier eine kurze
  Übersicht:

  FLRY-Leitungen

  FLRY steht für „Flexible Low Voltage Reduced cross-section Y cable“ und ist in
  zwei Varianten erhältlich: FLRY-A und FLRY-B.

  FLRY-A

  Eigenschaften: Dünnere Isolierung, kleinerer Außendurchmesser.

  Vorteile: Platzsparend und flexibel, ideal für enge Einbauräume.

  Einsatzbereich: Perfekt für Anwendungen, bei denen mechanische Belastungen
  gering sind, wie Beleuchtung oder kleinere Verbraucher.

  FLRY-B

  Eigenschaften: Dickere Isolierung im Vergleich zu FLRY-A.

  Vorteile: Bietet zusätzlichen mechanischen Schutz und ist abriebfester.

  Einsatzbereich: Geeignet für Bereiche mit mittlerer mechanischer Belastung.
