plot: >-
  **Typ:** Fehlerbild (Foto zeigt dünnes, rot-schwarzes HiFi-Kabel an einer
  12-V-Kühlbox-Steckdose).


  **Konkrete Frage:** Warum ist das günstige Lautsprecherkabel aus der
  Werkstatt-Restekiste ein gefährlicher Pfusch für die Camper-Stromversorgung?


  **Reihenfolge der Argumente:**

  *   **Der Trugschluss:** Kupfer ist Kupfer? Falsch. Warum Lautsprecherkabel
  oft aus billigem CCA (Aluminium mit dünnem Kupfermantel) bestehen, das einen
  viel höheren Widerstand hat.

  *   **Das Isolations-Risiko:** Die weiche PVC-Hülle von HiFi-Kabeln ist nicht
  für Vibrationen, Hitze und Scheuern im Kfz-Bereich (Stichwort: Fahrzeugleitung
  FLRY) ausgelegt. Kurzschlussgefahr!

  *   **Die Praxis-Rechnung:** Was passiert bei einer typischen Kühlbox?

  *   **Der System-Ausfall:** Warum die Kühlbox wegen des hohen Spannungsabfalls
  im dünnen Alu-Kabel ständig auf Störung (Unterspannungsschutz) geht.

  *   **Die Lösung:** Nur echte Kupfer-Fahrzeugleitungen (z.B. FLY / FLRY)
  nutzen und den Querschnitt exakt berechnen.


  **Berechnete Zahlen (mit `wire_cross_section`):**

  *   **Szenario:** Kompressorkühlbox (6 A Dauerstrom) in 4 Metern Entfernung
  (400 cm einfache Länge) bei 12 V Systemspannung.

  *   **Ergebnis:** Erforderlicher Querschnitt für Kupferleitung = **6 mm²**
  (rechnerisch 3,57 mm² plus 12 % Sicherheitsmarge, aufgerundet auf die nächste
  Standardgröße). Ein typisches 1,5-mm²-Lautsprecherkabel ist hier eine
  Brandgefahr.


  **Verlinkbare Ziele:**

  *   `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/`
  (Hauptlink im Text)

  *   `https://camper-elektrik-planer.de/` (Verweis am Ende für die gesamte
  Elektro-Stückliste)


  **Bild-Prompts:**

  *   *Bild 1:* Nahaufnahme eines rot-schwarzen, dünnen Lautsprecherkabels, das
  unsauber hinter einer Camper-Holzwand verlegt ist. Natürliches, helles
  Tageslicht.

  *   *Bild 2:* Ein sauber strukturierter Camper-Sicherungshalter mit ordentlich
  gecrimpten, dicken roten und schwarzen FLYR-Fahrzeugleitungen im warmen Licht
  der goldenen Stunde.
