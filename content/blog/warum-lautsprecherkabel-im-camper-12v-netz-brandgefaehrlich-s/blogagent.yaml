plot: >-
  **Fall-Typ:** Fehlerbild (Lautsprecherkabel als Stromleitung missbraucht).


  **Die konkrete Frage:** Warum haben Lautsprecherkabel im 12-V-Netz des Campers
  absolut nichts verloren?


  **Reihenfolge der Beantwortung (Drehbuch):**

  1. **Der Hook (Fehlerbild):** Das typische rot-schwarze oder transparente
  Lautsprecherkabel, das im Camper-Sicherungskasten klemmt. Es sieht harmlos
  aus, ist aber eine tickende Zeitbombe.

  2. **Das echte Problem (Isolierung):** Es geht nicht um den Kupferkern oder
  Leitfähigkeit. Lautsprecherkabel haben eine Isolierung (oft billiges PVC), die
  im Brandfall extrem leicht entflammbar ist, tropft und giftige Gase freisetzt.

  3. **Der Standard (Fahrzeugleitung):** Echte Kfz-Leitungen (z. B. FLRY oder
  FLY) sind nach ISO 6722 flammhemmend und selbstlöschend. Sie brennen nicht
  weiter, wenn die Hitzequelle weg ist.

  4. **Das Rechenbeispiel (Gefahr durch Spannungsabfall):** Warum dünne Strippen
  doppelt gefährlich sind.

  5. **Die Lösung:** Nur zertifizierte Fahrzeugleitungen nutzen, richtig
  dimensionieren und passend absichern.

  6. **Call to Action:** Link zum Kabelrechner.


  **Berechnetes Beispiel:**

  *   Verbraucher: Kompressor-Kühlbox (12 V, 10 A) in 4 m Entfernung (einfacher
  Weg = 400 cm).

  *   Ergebnis laut Tool `wire_cross_section`: Erforderlicher Querschnitt = **8
  mm²** (um den Spannungsabfall unter 2 % zu halten). Ein typisches 1,5 mm² oder
  2,5 mm² Lautsprecherkabel ist hier massiv unterdimensioniert und wird
  brandgefährlich heiß.


  **Verlinkbare Ziele:**

  *   `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/`


  **Bildideen:**

  *   **Bild 1:** Makroaufnahme einer Camper-Elektrik, bei der ein transparentes
  Lautsprecherkabel laienhaft in einer Lüsterklemme oder einem Sicherungshalter
  steckt. Natürliches Licht, Fokus auf dem Kabel.

  *   **Bild 2:** Professionell gecrimpte, rote und schwarze FLRY-Kfz-Leitungen
  mit sauberem Schrumpfschlauch an einer Stromschiene. Ästhetischer
  Pinterest-Look, hell und ordentlich.
