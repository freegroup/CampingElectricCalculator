plot: >-
  **Falltyp**

  Bauteil (MIDI-/ANL-Sicherungshalter & dicke Kabel aus `foto-1.webp`).


  **Konkrete Frage**

  Wie berechne ich Sicherung und Kabelquerschnitt für Camper-Geräte, wenn ich
  nur Watt-Angaben habe?


  **Reihenfolge der Beantwortung**

  *   **Der Einstieg (Bild-Bezug `foto-1.webp`):** Warum Sicherungen
  (Leitungsschutz) und dicke Kabel die Lebensversicherung deines Vans sind.

  *   **Die Übersetzungs-Formel:** Wie du aus Watt und Volt ganz einfach die
  Stromstärke (Ampere) machst (Formel: Watt / Volt = Ampere).

  *   **Die goldene Regel:** Sicherungen schützen das Kabel, nicht das Gerät.
  Erst Kabelquerschnitt bestimmen, dann passend absichern.

  *   **Das Rechenbeispiel (Ladebooster):** 40 A Strombedarf bei 12 V und 2 m
  (200 cm) einfacher Kabellänge.

  *   **Das Ergebnis:** Laut Rechner werden 16 mm² Kabel benötigt. Absicherung
  dazu: 50 A (nächsthöhere Standard-Sicherung über dem Betriebsstrom).

  *   **Der Weg zum Tool:** Verweis auf den Rechner für alle weiteren
  Camper-Komponenten.


  **Gerechnete Zahlen**

  *   Eingabe: 40 A, 200 cm Länge, 12 V Systemspannung.

  *   Ergebnis: 16 mm² empfohlen (berechnet: 11,9 mm² + Sicherheitsmarge).

  *   Passende Sicherung für dieses Setup: 50 A MIDI-Sicherung (aus
  `foto-1.webp`).


  **Verlinkbare Ziele**

  *   `https://camper-elektrik-planer.de/de/kabelquerschnitt-berechnen/` (Direkt
  im Rechenbeispiel)

  *   `https://camper-elektrik-planer.de/` (Für die Gesamtplanung am Ende)
